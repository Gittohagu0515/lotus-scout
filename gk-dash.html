<script>
(function () {
  const { useState, useMemo } = React;
  const html = htm.bind(React.createElement);
  const L = window.LucideReact || {};
  const Icon = ({ name, size = 18 }) => (L[name] ? React.createElement(L[name], { size, "aria-hidden": true, style: { display: "inline", verticalAlign: "-3px" } }) : null);
  const D = window.DATA;
  const INL = D.inline;
  const EVS = D.events;
  const LOT = EVS.filter((e) => e.team === "lotus");
  // ゴールの3×3（画面＝シューター側から見た配置）。左列＝GKの右手・右足側
  const GRID = [
    ["左上", "中上", "右上"],
    ["左中", "中央", "右中"],
    ["左下", "中下", "右下"],
  ];
  const ALIAS = { "中中": "中央" };
  const BODY = {
    "左上": "GKの右手上", "中上": "GKの頭上・顔面", "右上": "GKの左手上",
    "左中": "GKの右手横", "中央": "GKの胴体正面", "右中": "GKの左手横",
    "左下": "GKの右足下", "中下": "GKの足元中央", "右下": "GKの左足下",
  };
  const RES = { G: "得点", S: "セーブ", M: "枠外", B: "ブロック", P: "ポスト", TO: "ターンオーバー", "7MW": "7m獲得", TT: "タイムアウト", "2M": "2分退場" };
  const isShot = (e) => ["G", "S", "M", "B", "P"].includes(e.res);
  const zoneOf = (e) => ALIAS[e.z9] || e.z9;
  const heat = (g) => ["var(--h0)", "var(--h1)", "var(--h2)", "var(--h3)", "var(--h4)", "var(--h5)"][Math.min(g, 5)];

  function Vid({ url, lab }) {
    if (!url) return null;
    return html`<a class="vid" href=${url} target="_blank" rel="noopener"><span class="pl" aria-hidden="true">▶</span>${lab}</a>`;
  }

  function Goal({ shots, sel, onSel, small }) {
    const cnt = {};
    shots.forEach((e) => {
      const z = zoneOf(e);
      if (!BODY[z]) return;
      cnt[z] = cnt[z] || { G: 0, S: 0, n: 0 };
      cnt[z].n++;
      if (e.res === "G") cnt[z].G++;
      if (e.res === "S") cnt[z].S++;
    });
    return html`<div>
      <div class="flex justify-between text-xs muted px-1 mb-1"><span>← 画面の左（シューターの左）＝ GKの右手・右足側</span></div>
      <div class="goalframe"><div class="g3">
        ${GRID.flat().map((z) => {
          const c = cnt[z] || { G: 0, S: 0, n: 0 };
          const dark = c.G >= 3;
          return html`<button type="button" key=${z} class="cell" aria-pressed=${sel === z ? "true" : "false"}
            style=${{ background: heat(c.G), color: dark ? "#ffffff" : "var(--ink)", minHeight: small ? "62px" : "92px" }}
            onClick=${() => onSel && onSel(sel === z ? null : z)} aria-label=${`${z}（${BODY[z]}）：得点${c.G}・セーブ${c.S}・シュート${c.n}`}>
            <div>
              <div class="text-[11px] leading-tight opacity-90">${BODY[z]}</div>
              ${c.n ? html`<div class=${small ? "text-lg font-bold" : "text-2xl font-bold"}>${c.G}点</div><div class="text-[11px]">セーブ ${c.S}／${c.n}本</div>` : html`<div class="text-xs opacity-60">—</div>`}
            </div></button>`;
        })}
      </div></div>
      <div class="flex justify-between text-xs muted px-1 mt-1"><span>画面の右（シューターの右）＝ GKの左手・左足側 →</span></div>
    </div>`;
  }

  function ShotRow({ e }) {
    return html`<details class="card p-3">
      <summary class="flex flex-wrap items-center gap-2">
        <span class="font-bold">No.${e.no}</span><span>${e.shooter}</span><span class="muted">${e.loc}</span>
        <span>${zoneOf(e)}${BODY[zoneOf(e)] ? `（${BODY[zoneOf(e)]}）` : ""}</span>
        <span class=${e.res === "G" ? "hl" : ""}>${RES[e.res] || e.res}</span>
        <span class="muted">${e.traj} ${e.gkpos}</span>
        <${Vid} url=${e.url} lab=${e.lab} />
      </summary>
      <div class="mt-2 text-sm grid gap-1">
        <div><b>見えたこと：</b>${e.obs}</div>
        ${e.interp ? html`<div><b>解釈：</b>${e.interp}</div>` : null}
        <${Raw} raw=${e.raw} />
      </div></details>`;
  }

  function Raw({ raw }) {
    return html`<details><summary class="muted text-xs">この行のデータを全部見る</summary>
      <div class="tbl mt-1"><table><tbody>
        ${Object.entries(raw).map(([k, v]) => html`<tr key=${k}><th class="muted">${k}</th><td style=${{ whiteSpace: "normal" }}>${typeof v === "object" ? JSON.stringify(v) : String(v)}</td></tr>`)}
      </tbody></table></div></details>`;
  }

  function App() {
    const shooters = useMemo(() => {
      const c = {};
      LOT.filter(isShot).forEach((e) => (c[e.shooter] = (c[e.shooter] || 0) + 1));
      return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([k]) => k);
    }, []);
    const [who, setWho] = useState("全員");
    const [half, setHalf] = useState("全部");
    const [res, setRes] = useState("全部");
    const [zone, setZone] = useState(null);
    const [pick, setPick] = useState(null); // 形のイベント番号で絞る
    const [teamAll, setTeamAll] = useState("lotus");
    const base = LOT.filter(isShot).filter((e) => (who === "全員" || e.shooter === who) && (half === "全部" || e.half === half) && (res === "全部" || (res === "得点" ? e.res === "G" : e.res === "S")) && (!pick || pick.includes(e.no)));
    const listed = base.filter((e) => !zone || zoneOf(e) === zone);
    const ov = INL.match_overview;
    const sev = INL.seven_meter_throw_complete_guide_for_gk;
    const tb = INL.three_back_system_anatomy_for_gk;
    const chip = (v, cur, set, label) => html`<button type="button" class="chipbtn" aria-pressed=${cur === v ? "true" : "false"} onClick=${() => { set(v); setZone(null); }}>${label || v}</button>`;

    return html`<div class="wrap grid gap-8">
      <header class="grid gap-3">
        <div class="text-xs tracking-widest muted">11/07 HC Lotus 戦　東邦大東邦中 GK 専用</div>
        <h1 class="disp text-3xl sm:text-4xl leading-tight">Lotus <span style=${{ color: "var(--heat)" }}>シュート</span> GK 対策</h1>
        <p class="muted m-0">${ov.source_match}</p>
        <nav class="nav flex flex-wrap gap-2" aria-label="もくじ">
          <a href="#map">ゴール図</a><a href="#rules">形ごとの鉄則</a><a href="#seven">7m</a><a href="#players">選手別</a><a href="#all">全イベント</a><a href="#note">データの注意</a>
        </nav>
      </header>

      <section class="card p-4 grid gap-2" aria-labelledby="h-key">
        <h2 id="h-key" class="disp text-xl"><${Icon} name="Target" /> いちばん大事なこと</h2>
        <p class="m-0">${ov.core_takeaway_for_toho_gk}</p>
        <div class="text-sm muted grid gap-1">
          <div>前半：${ov.score_progression.first_half}</div>
          <div>後半①：${ov.score_progression.second_half_part_1}</div>
          <div>後半②・③：${ov.score_progression.second_half_part_2_and_3}</div>
        </div>
        <p class="text-sm m-0"><b>向きの決まり：</b>${INL.coordinate_system_definition.visual_grid_layout}。${INL.coordinate_system_definition.left_column_on_screen}／${INL.coordinate_system_definition.center_column_on_screen}／${INL.coordinate_system_definition.right_column_on_screen}</p>
      </section>

      <section id="map" class="grid gap-3" aria-labelledby="h-map">
        <h2 id="h-map" class="disp text-2xl"><${Icon} name="Grid3x3" /> ゴール図：どこに打ってくるか</h2>
        <p class="m-0 muted text-sm">Lotus のシュート（得点・セーブ・枠外・ブロック・ポスト）。色がこいほど点を取られた所。マスを押すと、そのマスのシュートが下に出ます。</p>
        <div class="flex flex-wrap gap-2" role="group" aria-label="選手">${chip("全員", who, setWho)}${shooters.map((s) => chip(s, who, setWho))}</div>
        <div class="flex flex-wrap gap-2" role="group" aria-label="前半後半">${["全部", "前半", "後半"].map((h) => chip(h, half, setHalf))}<span class="w-3"></span>${["全部", "得点", "セーブ"].map((r) => chip(r, res, setRes))}</div>
        ${pick ? html`<div class="rule text-sm flex items-center gap-2 flex-wrap"><b>形で絞っています：</b>No.${pick.join(", ")}<button type="button" class="chipbtn" onClick=${() => setPick(null)}>解除</button></div>` : null}
        <${Goal} shots=${base} sel=${zone} onSel=${setZone} />
        <p class="m-0 text-sm">${base.length}本（得点 ${base.filter((e) => e.res === "G").length}・セーブ ${base.filter((e) => e.res === "S").length}）。ゴールの場所がない枠外・ブロックはマスに入りません。</p>
        <div class="grid gap-2">${listed.map((e) => html`<${ShotRow} key=${e.no} e=${e} />`)}</div>
      </section>

      <section id="rules" class="grid gap-4" aria-labelledby="h-rules">
        <h2 id="h-rules" class="disp text-2xl"><${Icon} name="Shield" /> 形ごとの鉄則</h2>
        <p class="m-0">${tb.summary}</p>
        ${tb.tactical_patterns.map((p) => html`<div key=${p.code} class="grid gap-3">
          <h3 class="text-lg font-bold m-0">${p.code}：${p.name}</h3>
          ${p.sub_patterns.map((s) => html`<article key=${s.type} class="card p-4 grid gap-2">
            <h4 class="font-bold m-0">${s.type}</h4>
            <p class="m-0 text-sm"><b>形：</b>${s.mechanism}</p>
            <div class="rule text-sm"><b style=${{ color: "var(--heat)" }}>GK：</b>${s.gk_rule}</div>
            <div class="flex flex-wrap gap-2 items-center">
              <button type="button" class="chipbtn" onClick=${() => { setPick(s.events); setWho("全員"); setHalf("全部"); setRes("全部"); setZone(null); location.hash = "#map"; }}><${Icon} name="Crosshair" size=${15} /> ゴール図で見る</button>
              ${s.events.map((n) => { const e = EVS.find((x) => x.no === n); return e && e.url ? html`<${Vid} key=${n} url=${e.url} lab=${"No." + n} />` : null; })}
            </div>
          </article>`)}
        </div>`)}
      </section>

      <section id="seven" class="grid gap-3" aria-labelledby="h-seven">
        <h2 id="h-seven" class="disp text-2xl"><${Icon} name="Timer" /> #15 の 7m</h2>
        <div class="card p-4 grid gap-2">
          <div><b>キッカー：</b>${sev.kicker}</div>
          <div><b>記録：</b>${sev.full_match_record}</div>
          <div class="rule text-sm"><b style=${{ color: "var(--heat)" }}>リズムとくせ：</b>${sev.rhythm_and_form_habit}</div>
          <div class="text-sm" style=${{ whiteSpace: "pre-line" }}>${sev.toho_gk_7m_rule_received_part}</div>
        </div>
        <div class="grid sm:grid-cols-2 gap-3">
          ${sev.chronological_6_shots_trajectory.map((s) => html`<article key=${s.shot_order} class="card p-3 grid gap-2">
            <div class="font-bold">${s.shot_order}</div>
            <${Goal} small=${true} shots=${[{ z9: s.zone, res: s.result[0] }]} />
            <div class="text-sm"><b>${s.screen_and_shooter_zone}</b> ${s.gk_body_part_side}／${s.trajectory}／GK ${s.gk_position}／結果 <span class=${s.result[0] === "G" ? "hl" : ""}>${s.result}</span></div>
            <div class="text-sm muted">${s.detail}</div>
            <div class="text-xs muted">10秒前：${s.video_ref_10s_before}／放った時刻：${s.impact_time}</div>
            <div><${Vid} url=${s.url} lab=${s.lab} /></div>
          </article>`)}
        </div>
      </section>

      <section id="players" class="grid gap-3" aria-labelledby="h-pl">
        <h2 id="h-pl" class="disp text-2xl"><${Icon} name="Users" /> 選手別のゴール図</h2>
        <div class="grid sm:grid-cols-2 gap-3">
          ${shooters.map((s) => { const sh = LOT.filter(isShot).filter((e) => e.shooter === s); return html`<article key=${s} class="card p-3 grid gap-2">
            <div class="flex items-baseline gap-2"><span class="disp text-2xl" style=${{ color: "var(--heat)" }}>${s}</span><span class="text-sm muted">${sh.length}本・得点 ${sh.filter((e) => e.res === "G").length}</span></div>
            <div class="text-xs muted">${(D.meta1.confirmed_roster.lotus || {})[s] || ""}</div>
            <${Goal} small=${true} shots=${sh} />
          </article>`; })}
        </div>
      </section>

      <section id="all" class="grid gap-3" aria-labelledby="h-all">
        <h2 id="h-all" class="disp text-2xl"><${Icon} name="List" /> 全イベント（${EVS.length}件）</h2>
        <div class="flex flex-wrap gap-2" role="group" aria-label="チーム">${chip("lotus", teamAll, setTeamAll, "Lotus の攻め")}${chip("若松", teamAll, setTeamAll, "若松の攻め")}${chip("all", teamAll, setTeamAll, "全部")}</div>
        <div class="grid gap-2">${EVS.filter((e) => teamAll === "all" || e.team === teamAll).map((e) => html`<${ShotRow} key=${e.no + e.team} e=${e} />`)}</div>
      </section>

      <section id="note" class="card p-4 grid gap-2 text-sm" aria-labelledby="h-note">
        <h2 id="h-note" class="disp text-xl"><${Icon} name="TriangleAlert" /> データの注意</h2>
        <p class="m-0">このページの数字・法則は、ヤスさんからいただいたデータ（全114イベント）のものです。動画6本から作った別の記録表（最後のスコア若松 21−19 と合うことを確かめた記録）とは、次の点が食い違っています。</p>
        <ul class="list-disc pl-5 grid gap-1">
          <li>前半終了のスコア：このデータは Lotus 11−10、記録表は Lotus 10−11。試合の最後：このデータは 19−22、記録表は 19−21（若松の勝ち）。</li>
          <li>Lotus の GK の背番号：このデータは #12、記録表は #1（若松の GK が #1 と #12）。</li>
          <li>#15 の 7m 1本目（前半 5:14）：このデータは得点、記録表は「GK の手か枠に当たって外れた（得点ではない）」。</li>
          <li>#7 は「前半ベンチ」となっているが、記録表では前半 9:54 に左サイドから得点している。#14 の利き腕は、記録表では左。</li>
          <li>ゴールの9つの場所は、同じ場面を2人が見ても合わないことがあった。「100%」は数本からの言い方なので、構えの目安として使う。</li>
        </ul>
        <p class="m-0 muted">動画ボタンは、データの時刻から場面の10秒前に合わせています。いただいたメッセージのデータは「7mスロー完全攻略法則」の途中で切れていたので、受け取れた所まで載せています。</p>
      </section>
    </div>`;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
})();
</script>

</body>
</html>
