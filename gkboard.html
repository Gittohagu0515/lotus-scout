    "fact_and_gk_note": "【#15 7m攻略例② ＆ #13左下固定化（5・6本目）】07:54に#15がワンドリブルからGK右手側中段（左中）へ7mスローを打つが、G1のGKが右手でセーブ。さらに再開後の09:40と09:51に#13が左45度から突破して2本ともGK右足側下（左下）へ打つが、ともにGKが右足でセーブ（さらにno:114内の10:18の#13の中央シュートもGKセーブで試合終了）。"
   }
  ]
 }
};window.OFFSETS={
 "_note": "YouTube 元動画での各ファイルの開始秒。3分割のファイルは継ぎ目で重なっている（次のファイルの最初のフレームが前のファイルの最後の数秒と同一＝差0.0）。前半1本目の開始＝YouTube 0秒（Yasu さんの基準 t=140s→2分30秒の #15 得点＝01 02:30.0 と一致）",
 "video_id": {"01": "xpV7EHyMtbo", "02": "xpV7EHyMtbo", "03": "xpV7EHyMtbo", "04": "aeo-WZs4pp0", "05": "aeo-WZs4pp0", "06": "aeo-WZs4pp0"},
 "offset": {"01": 0.0, "02": 616.274, "03": 1238.173, "04": 0.0, "05": 633.073, "06": 1274.939},
 "overlap_sec": {"01-02": 2.97, "02-03": 0.33, "04-05": 5.47, "05-06": 2.13}
}
;</script>
<script>/* Lotus GK ダッシュボード（東邦 GK 専用）。データは window.DATA（ヤスさん作成のスカウティングデータをそのまま） */
(function () {
  const { useState, useMemo } = React;
  const html = htm.bind(React.createElement);
  const L = window.LucideReact || {};
  const Icon = ({ name, size = 18, cls = "" }) => {
    const C = L[name];
    return C ? React.createElement(C, { size, className: cls, "aria-hidden": true }) : null;
  };
  const D = window.DATA;
  const OFF = window.OFFSETS;

  // ---------- 動画リンク（"前半① 05:04" など → YouTube の秒数）
  const SEG = { "前半①": "01", "前半②": "02", "前半③": "03", "後半①": "04", "後半②": "05", "後半③": "06" };
  function videoLink(ref) {
    const m = String(ref || "").match(/(前半|後半)([①②③])\s*(\d+):(\d+)/);
    if (!m) return null;
    const v = SEG[m[1] + m[2]];
    const t = Math.max(0, Math.floor(OFF.offset[v] + Number(m[3]) * 60 + Number(m[4])));
    return { url: `https://www.youtube.com/watch?v=${OFF.video_id[v]}&t=${t}s`, label: ref };
  }
  const VBtn = ({ refText, small }) => {
    const l = videoLink(refText);
    if (!l) return html`<span class="text-[12px] text-[var(--ink2)]">${refText}</span>`;
    return html`<a href=${l.url} target="_blank" rel="noopener"
      class="inline-flex items-center gap-2 rounded-full bg-[var(--btn)] text-[var(--btn-ink)] no-underline ${small ? "px-3 py-1 text-[12.5px]" : "px-3.5 py-1.5 text-[13.5px]"} font-bold focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-[var(--heat)]">
      <span class="grid place-items-center w-6 h-6 rounded-full bg-[var(--heat)] text-white"><${Icon} name="Play" size=${12} /></span>
      <span>${l.label}${String(l.label).includes("10秒前") ? "" : html`<span class="font-normal opacity-80">（10秒前から）</span>`}</span></a>`;
  };

  // ---------- 結果の色
  const resKey = (r) => String(r || "").trim().split(/[\s(（]/)[0];
  const RES_STYLE = {
    G: "bg-[var(--heat)] text-white", S: "bg-[var(--navy)] text-[var(--bg)]", M: "bg-[var(--chip)] text-[var(--ink)]",
    B: "bg-[var(--chip)] text-[var(--ink)]", TO: "bg-[var(--chip)] text-[var(--ink)]", "7MW": "bg-[var(--warn)] text-[var(--ink)]",
    TT: "bg-[var(--chip)] text-[var(--ink2)]", "2M": "bg-[var(--warn)] text-[var(--ink)]",
  };
  const RES_NAME = { G: "得点", S: "GKセーブ", M: "枠外", B: "ブロック", TO: "ターンオーバー", "7MW": "7m獲得", TT: "タイムアウト", "2M": "2分間退場誘発" };
  const ResChip = ({ r }) => {
    const k = resKey(r);
    return html`<span class="inline-block rounded-md px-2 py-0.5 text-[12.5px] font-bold ${RES_STYLE[k] || "bg-[var(--chip)]"}">${RES_NAME[k] ? RES_NAME[k] + "　" : ""}${r}</span>`;
  };

  // ---------- 3×3（GK 視点）
  const CELLS = [
    ["GK左手側上", "シューター右上", 0, 0], ["GK中上", "シューター中上", 1, 0], ["GK右手側上", "シューター左上", 2, 0],
    ["GK左手側中", "シューター右中", 0, 1], ["GK中央", "シューター中中", 1, 1], ["GK右手側中", "シューター左中", 2, 1],
    ["GK左足側下", "シューター右下", 0, 2], ["GK中下", "シューター中下", 1, 2], ["GK右足側下", "シューター左下", 2, 2],
  ];
  function cellOfKey(k) {
    const s = String(k);
    if (s.includes("〜") || s.includes("すべて")) return null;
    for (const c of CELLS) if (s.startsWith(c[0])) return c;
    return null;
  }
  const gNum = (total) => { const m = String(total).match(/(\d+)\s*G/); return m ? Number(m[1]) : 0; };
  const sNum = (total) => { const m = String(total).match(/(\d+)\s*S/); return m ? Number(m[1]) : 0; };
  const HEAT = ["var(--h0)", "var(--h1)", "var(--h2)", "var(--h3)", "var(--h4)"];

  function GoalGrid({ map, marks }) {
    // map: { key: {total, breakdown} }  marks: [{cell:[c,r], label}]
    const byPos = {};
    if (map) for (const [k, v] of Object.entries(map)) { const c = cellOfKey(k); if (c) byPos[c[2] + "," + c[3]] = { k, ...v }; }
    return html`<div class="grid gap-1.5">
      <div class="flex justify-between text-[12px] text-[var(--ink2)] font-bold"><span>← 自分（GK）の左手側</span><span>GKから見た向き</span><span>右手側 →</span></div>
      <div class="grid grid-cols-3 gap-1 p-1.5 rounded-lg" style=${{ background: "repeating-linear-gradient(90deg,#c0392b 0 18px,#ffffff 18px 36px)" }}>
        ${CELLS.map((c) => {
          const e = byPos[c[2] + "," + c[3]];
          const g = e ? gNum(e.total) : 0;
          const mk = (marks || []).filter((m) => m.cell[0] === c[2] && m.cell[1] === c[3]);
          const bg = mk.length ? (mk.some((m) => m.goal) ? "var(--h3)" : "var(--navy-soft)") : HEAT[Math.min(g, 4)];
          const dark = (!mk.length && g >= 3) || mk.some((m) => m.goal);
          return html`<div class="rounded-md p-1.5 min-h-[74px] flex flex-col justify-between" style=${{ background: bg, color: dark ? "#ffffff" : "#1f1f1e" }}>
            <div class="text-[11.5px] font-bold leading-tight">${c[0].replace("GK", "")}<span class="font-normal opacity-80">（${c[1]}）</span></div>
            ${e ? html`<div class="text-[15px] font-bold leading-tight">${e.total}</div>` : null}
            ${mk.map((m) => html`<div class="text-[12px] font-bold leading-tight">${m.label}</div>`)}
          </div>`;
        })}
      </div>
      <div class="flex justify-between text-[11.5px] text-[var(--ink2)]"><span>上＝高い / 下＝低い（足もと）</span><span>色がこいほど得点されている</span></div>
    </div>`;
  }

  function MapList({ map }) {
    return html`<div class="grid gap-2">
      ${Object.entries(map).map(([k, v]) => html`<div class="rounded-lg border border-[var(--line)] p-2.5">
        <div class="flex flex-wrap items-baseline gap-x-2"><b class="text-[14px]">${k}</b><span class="font-bold text-[var(--heat)]">${v.total}</span></div>
        <div class="text-[13px] text-[var(--ink2)] mt-0.5">${v.breakdown}</div>
      </div>`)}
    </div>`;
  }

  // ---------- 共通の部品
  const Card = ({ children, cls = "" }) => html`<div class="rounded-2xl border border-[var(--line)] bg-[var(--card)] p-4 grid gap-3 ${cls}">${children}</div>`;
  const H2 = ({ icon, children }) => html`<h2 class="flex items-center gap-2 text-[22px] font-display m-0"><${Icon} name=${icon} size=${22} cls="text-[var(--heat)]" />${children}</h2>`;
  const Rule = ({ text }) => html`<div class="rounded-xl bg-[var(--heat-soft)] p-3 text-[14.5px] leading-relaxed"><${Icon} name="Hand" size=${16} cls="inline -mt-1 mr-1 text-[var(--heat)]" />${text}</div>`;
  function Acc({ title, sub, children, open }) {
    const [o, setO] = useState(!!open);
    return html`<div class="rounded-xl border border-[var(--line)] bg-[var(--card)]">
      <button type="button" onClick=${() => setO(!o)} aria-expanded=${o}
        class="w-full text-left flex items-start gap-2 p-3 focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-[var(--heat)] rounded-xl">
        <span class="mt-0.5"><${Icon} name=${o ? "ChevronDown" : "ChevronRight"} size=${18} /></span>
        <span class="grid"><b class="text-[15.5px]">${title}</b>${sub ? html`<span class="text-[12.5px] text-[var(--ink2)]">${sub}</span>` : null}</span>
      </button>
      ${o ? html`<div class="px-3 pb-3 grid gap-3">${children}</div>` : null}
    </div>`;
  }
  const KV = ({ k, v }) => html`<div class="grid grid-cols-[6.5em_1fr] gap-2 text-[14px]"><span class="text-[var(--ink2)]">${k}</span><span class="min-w-0">${v}</span></div>`;

  // ---------- タブ1：概要
  function Overview() {
    const o = D.match_overview;
    return html`<div class="grid gap-4">
      <${Card}>
        <${H2} icon="ClipboardList">試合と目的<//>
        <${KV} k="相手" v=${o.target_opponent} />
        <${KV} k="使う人" v=${o.user_perspective} />
        <${KV} k="元の試合" v=${o.source_match} />
      <//>
      <${Card}>
        <${H2} icon="Timer">スコアの流れ<//>
        <${KV} k="前半" v=${o.score_progression.first_half} />
        <${KV} k="後半①" v=${o.score_progression.second_half_part_1} />
        <${KV} k="後半②③" v=${o.score_progression.second_half_part_2_and_3} />
      <//>
      <${Card}>
        <${H2} icon="Shield">東邦 GK へのいちばん大事なこと<//>
        <${Rule} text=${o.core_takeaway_for_toho_gk} />
      <//>
      <${Card}>
        <${H2} icon="Grid3x3">コース表記の決まり<//>
        <p class="m-0 text-[14px]">ゴールの9マスは、東邦の GK 自身から見た向き（左手側・右手側・左足側・右足側）で書き、かっこの中にシューターから見た向きを書いています。</p>
        <${GoalGrid} map=${null} />
      <//>
    </div>`;
  }

  // ---------- タブ2：3バック解剖
  function ThreeBack() {
    const t = D.three_back_system_anatomy_for_gk;
    return html`<div class="grid gap-4">
      <${Card}><${H2} icon="Users">3バックのしくみ<//><p class="m-0 text-[14.5px] leading-relaxed">${t.summary}</p><//>
      <${Card}>
        <${H2} icon="TrendingUp">前半と後半で変わる役割<//>
        ${Object.entries(t.phase_shift_mechanism).map(([k, v]) => html`<div class="grid gap-1"><b class="text-[15px]">${k}</b><p class="m-0 text-[14px] leading-relaxed">${v}</p></div>`)}
      <//>
      ${t.tactical_patterns.map((p, i) => html`<${Acc} title=${p.code + "　" + p.name} sub=${p.sub_patterns.length + "つの形"} open=${i === 0}>
        ${p.sub_patterns.map((s) => html`<div class="rounded-xl border border-[var(--line)] p-3 grid gap-2">
          <b class="text-[14.5px]">${s.type}</b>
          <div class="text-[13.5px] leading-relaxed"><span class="font-bold text-[var(--ink2)]">動き：</span>${s.mechanism}</div>
          <${Rule} text=${s.gk_rule} />
        </div>`)}
      <//>`)}
    </div>`;
  }

  // ---------- タブ3：選手別
  function Players() {
    const P = D.player_by_player_gk_save_manuals;
    const [i, setI] = useState(0);
    const p = P[i];
    return html`<div class="grid gap-4">
      <div class="flex flex-wrap gap-2" role="tablist" aria-label="選手">
        ${P.map((x, k) => html`<button type="button" role="tab" aria-selected=${k === i} onClick=${() => setI(k)}
          class="rounded-full px-4 py-1.5 text-[15px] font-bold border ${k === i ? "bg-[var(--heat)] text-white border-[var(--heat)]" : "bg-[var(--card)] border-[var(--line)]"} focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-[var(--heat)]">${x.player_id}</button>`)}
      </div>
      <${Card}>
        <div class="flex items-baseline gap-3 flex-wrap"><span class="font-display text-[34px] leading-none text-[var(--heat)]">${p.player_id}</span><b class="text-[16px]">${p.name_and_role}</b></div>
        <${KV} k="シュート" v=${p.full_match_shooting_summary} />
      <//>
      ${p.shot_map_gk_view_3x3_full_match ? html`<${Card}>
        <${H2} icon="Grid3x3">GK から見た着弾マップ（1試合）<//>
        <${GoalGrid} map=${p.shot_map_gk_view_3x3_full_match} />
        <b class="text-[14px]">マスごとの中身（全部）</b>
        <${MapList} map=${p.shot_map_gk_view_3x3_full_match} />
      <//>` : null}
      <${Card}>
        <${H2} icon="Hand">GK の動き方<//>
        ${p.gk_action_rules.map((r) => html`<${Rule} text=${r} />`)}
      <//>
    </div>`;
  }

  // ---------- タブ4：7m
  const COURSE_CELL = (s) => { for (const c of CELLS) if (String(s).startsWith(c[0])) return [c[2], c[3]]; const m = { "GK左手側中段": [0, 1], "GK右手側中段": [2, 1] }; for (const k in m) if (String(s).startsWith(k)) return m[k]; return null; };
  function Seven() {
    const s = D.seven_meter_throw_complete_guide_for_gk;
    const marks = s.chronological_6_shots_trajectory.map((x, k) => ({ cell: COURSE_CELL(x.course_gk_view), label: `${k + 1}本目 ${resKey(x.result) === "G" ? "得点" : "セーブ"}`, goal: resKey(x.result) === "G" })).filter((m) => m.cell);
    return html`<div class="grid gap-4">
      <${Card}>
        <${H2} icon="Target">7mスロー<//>
        <${KV} k="キッカー" v=${s.kicker} />
        <${KV} k="結果" v=${s.full_match_record} />
        <${KV} k="リズムとくせ" v=${s.rhythm_and_form_habit} />
      <//>
      <${Card}>
        <${H2} icon="Grid3x3">6本のコース（GK から見た向き）<//>
        <${GoalGrid} map=${null} marks=${marks} />
      <//>
      ${s.chronological_6_shots_trajectory.map((x) => html`<${Card}>
        <div class="flex items-center justify-between flex-wrap gap-2"><b class="text-[16px]">${x.shot_order}</b><${ResChip} r=${x.result} /></div>
        <${KV} k="コース" v=${html`<b>${x.course_gk_view}</b><span class="text-[var(--ink2)]">（シューター視点：${x.course_shooter_view}）</span>`} />
        <${KV} k="GK の位置" v=${x.gk_position} />
        <${KV} k="軌道" v=${x.trajectory} />
        <${KV} k="放った時刻" v=${x.impact_time} />
        <p class="m-0 text-[14px] leading-relaxed">${x.detail}</p>
        <div><${VBtn} refText=${x.video_ref_10s_before} /></div>
      <//>`)}
      <${Card}>
        <${H2} icon="ShieldCheck">7m の攻略法則<//>
        ${String(s.toho_gk_7m_rule).split("\n").map((l) => html`<p class="m-0 text-[14.5px] leading-relaxed">${l}</p>`)}
      <//>
    </div>`;
  }

  // ---------- タブ5：全攻撃ログ
  function Logs() {
    const LG = D.complete_chronological_lotus_attack_logs;
    const [half, setHalf] = useState("all");
    const [actor, setActor] = useState("all");
    const [res, setRes] = useState("all");
    const all = useMemo(() => [...LG.first_half_lotus_events.map((e) => ({ ...e, h: "前半" })), ...LG.second_half_lotus_events.map((e) => ({ ...e, h: "後半" }))], []);
    const actorKey = (e) => { const m = String(e.actor).match(/#\d+/); return m ? m[0] : "その他"; };
    const actors = [...new Set(all.map(actorKey))];
    const results = [...new Set(all.map((e) => resKey(e.result)))];
    const list = all.filter((e) => (half === "all" || e.h === half) && (actor === "all" || actorKey(e) === actor) && (res === "all" || resKey(e.result) === res));
    const Chip = ({ on, onClick, children }) => html`<button type="button" onClick=${onClick} aria-pressed=${on}
      class="rounded-full px-3 py-1 text-[13.5px] font-bold border ${on ? "bg-[var(--btn)] text-[var(--btn-ink)] border-[var(--btn)]" : "bg-[var(--card)] border-[var(--line)]"} focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-[var(--heat)]">${children}</button>`;
    return html`<div class="grid gap-4">
      <${Card}>
        <p class="m-0 text-[14px] leading-relaxed">${LG.description}</p>
        <div class="grid gap-2">
          <div class="flex flex-wrap gap-2"><span class="text-[13px] text-[var(--ink2)] w-12">前後半</span>${["all", "前半", "後半"].map((h) => html`<${Chip} on=${half === h} onClick=${() => setHalf(h)}>${h === "all" ? "全部" : h}<//>`)}</div>
          <div class="flex flex-wrap gap-2"><span class="text-[13px] text-[var(--ink2)] w-12">選手</span><${Chip} on=${actor === "all"} onClick=${() => setActor("all")}>全員<//>${actors.map((a) => html`<${Chip} on=${actor === a} onClick=${() => setActor(a)}>${a}<//>`)}</div>
          <div class="flex flex-wrap gap-2"><span class="text-[13px] text-[var(--ink2)] w-12">結果</span><${Chip} on=${res === "all"} onClick=${() => setRes("all")}>全部<//>${results.map((r) => html`<${Chip} on=${res === r} onClick=${() => setRes(r)}>${RES_NAME[r] || r}<//>`)}</div>
        </div>
        <div class="text-[13px] text-[var(--ink2)]">表示中 ${list.length} 件 / 全 ${all.length} 件（前半 ${LG.first_half_lotus_events.length}・後半 ${LG.second_half_lotus_events.length}）</div>
      <//>
      ${list.map((e) => html`<div class="rounded-2xl border border-[var(--line)] bg-[var(--card)] p-3.5 grid gap-2">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <b class="text-[15px]">no:${e.no}<span class="font-normal text-[var(--ink2)] text-[12.5px]">（攻撃 ${e.attack_no}・${e.segment}）</span></b>
          <${ResChip} r=${e.result} />
        </div>
        <div class="text-[15px] font-bold">${e.actor}<span class="font-normal text-[13px] text-[var(--ink2)]">　${e.phase}　${e.pattern}</span></div>
        <${KV} k="コース" v=${html`<b>${e.course_gk_view}</b><span class="text-[var(--ink2)]">（シューター視点：${e.course_shooter_view}）</span>`} />
        <${KV} k="場所・種類" v=${e.location_and_type} />
        <${KV} k="GK の位置" v=${e.gk_pos} />
        <${KV} k="放った時刻" v=${e.impact_time} />
        <p class="m-0 text-[14px] leading-relaxed">${e.fact_and_gk_note}</p>
        <div><${VBtn} refText=${e.video_ref_10s_before} small=${true} /></div>
      </div>`)}
    </div>`;
  }

  // ---------- 全体
  const TABS = [["overview", "概要", "ClipboardList", Overview], ["threeback", "3バック", "Users", ThreeBack], ["players", "選手別", "UserRound", Players], ["seven", "7m", "Target", Seven], ["logs", "全攻撃ログ", "ListVideo", Logs]];
  function App() {
    const initial = (location.hash || "").replace("#", "");
    const [tab, setTab] = useState(TABS.some((t) => t[0] === initial) ? initial : "overview");
    const go = (k) => { setTab(k); try { history.replaceState(null, "", "#" + k); } catch (e) {} window.scrollTo({ top: 0 }); };
    const T = TABS.find((t) => t[0] === tab);
    return html`<div class="max-w-[760px] mx-auto grid gap-5 wrap">
      <header class="grid gap-2 pt-6">
        <div class="text-[13px] tracking-wider text-[var(--ink2)]">11/07 HC Lotus 戦　東邦 GK 専用</div>
        <h1 class="font-display text-[34px] leading-tight m-0">Lotus <span class="text-[var(--heat)]">GK</span> 攻略ボード</h1>
        <p class="m-0 text-[14px] text-[var(--ink2)]">▶ のボタンを押すと、その場面の10秒前から動画が始まります。</p>
      </header>
      <nav class="sticky z-10 -mx-1 px-1 py-2 bg-[var(--bg)] flex gap-1.5 overflow-x-auto" style=${{ top: "env(safe-area-inset-top, 0px)" }} role="tablist" aria-label="ページの中の切りかえ">
        ${TABS.map(([k, name, ic]) => html`<button type="button" role="tab" aria-selected=${tab === k} onClick=${() => go(k)}
          class="shrink-0 inline-flex items-center gap-1.5 rounded-full px-3.5 py-2 text-[14.5px] font-bold border ${tab === k ? "bg-[var(--heat)] text-white border-[var(--heat)]" : "bg-[var(--card)] border-[var(--line)]"} focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-[var(--heat)]">
          <${Icon} name=${ic} size=${16} />${name}</button>`)}
      </nav>
      <main class="pb-12"><${T[3]} /></main>
      <footer class="text-[12.5px] text-[var(--ink2)] pb-10">データ：ヤスさん作成の HC Lotus スカウティングデータ（2026/11/01 新人戦）をそのまま表示しています。</footer>
    </div>`;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
